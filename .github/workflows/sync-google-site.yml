name: Sync Google Site naar GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  mirror-site:
    runs-on: ubuntu-latest
    steps:
      - name: Haal huidige repository op
        uses: actions/checkout@v4

      - name: Download Google Site naar de hoofdmap
        run: |
          # Download naar een tijdelijke map
          mkdir temp_site
          wget --mirror \
               --convert-links \
               --adjust-extension \
               --page-requisites \
               --no-parent \
               --no-host-directories \
               --directory-prefix=temp_site \
               https://sites.google.com/view/fioverr || true
          
          # Verplaats alles vanuit de tijdelijke map naar de hoofdmap
          cp -rf temp_site/* .
          
          # Ruim de tijdelijke map en de oude site_export map op
          rm -rf temp_site site_export

      - name: Commit en push wijzigingen naar GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Google Site in root" && git push)
