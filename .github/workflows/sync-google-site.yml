name: Sync Google Site naar GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  mirror-site:
    runs-on: ubuntu-latest
    steps:
      - name: Haal huidige repository op
        uses: actions/checkout@v4

      - name: Download Google Site direct naar de hoofdmap
        run: |
          mkdir temp_site
          wget --mirror \
               --convert-links \
               --adjust-extension \
               --page-requisites \
               --no-parent \
               --no-host-directories \
               --cut-dirs=2 \
               --directory-prefix=temp_site \
               https://sites.google.com/view/fioverr/homepage || true
          
          # Hernoem de hoofdpagina (bijv. home.html of fioverr.html) naar index.html als index.html ontbreekt
          if [ ! -f temp_site/index.html ]; then
            FIRST_HTML=$(ls temp_site/*.html | head -n 1)
            if [ -n "$FIRST_HTML" ]; then
              cp "$FIRST_HTML" temp_site/index.html
            fi
          fi

          # Verwijder oude mappen/bestanden en zet de nieuwe bestanden in de hoofdmap
          rm -rf view sitesv-images-rt robots.txt
          cp -rf temp_site/* .
          rm -rf temp_site

      - name: Commit en push wijzigingen naar GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Google Site in root" && git push)
